<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Marker Paneli - Əl Yazısı Qeydiyyatı</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <!-- Daxil Olma Paneli -->
    <div id="login-card" class="card">
      <h2>Marker Girişi</h2>
      <div class="form-group">
        <label>İstifadəçi Adı:</label>
        <input type="text" id="username">
      </div>
      <div class="form-group">
        <label>Şifrə:</label>
        <input type="password" id="password">
      </div>
      <button id="login-btn">Daxil ol</button>
      <p id="login-error" style="color:red;" class="hidden">İstifadəçi adı və ya şifrə yanlışdır!</p>
    </div>

    <!-- İş Sahəsi -->
    <div id="workspace-card" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="user-info"></h3>
        <div class="timer-box">İşə sərf olunan vaxt: <span id="timer">00:00</span></div>
        <button id="logout-btn" class="danger">Çıxış</button>
      </div>
      <hr><br>

      <div class="workspace">
        <div class="image-container">
          <h4>Əl Yazısı Şəkli</h4>
          <img id="task-image" src="" alt="Yüklənir...">
          <br><br>
          <button id="unreadable-btn" class="danger">⚠️ Əl yazısı oxunmur (İşarələ)</button>
        </div>

        <div>
          <h4 id="task-mode-title">Mətni yığın</h4>
          <div class="form-group">
            <textarea id="transcription-text" rows="10" placeholder="Şəkildəki mətni bura daxil edin..."></textarea>
          </div>

          <div id="verification-actions" class="hidden">
            <p><strong>Status:</strong> Yoxlama rejimi (Digər markerin daxil etdiyi mətni yoxlayırsınız)</p>
            <button id="approve-btn" class="success">Düzğündür (Təsdiqlə)</button>
            <button id="correct-btn" style="background:#f59e0b;">Düzəliş et və Növbətiyə Keç</button>
          </div>

          <br>
          <button id="submit-btn">Təsdiq et və Növbəti</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
